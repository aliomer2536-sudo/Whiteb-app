name: Publish Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Pre-compiled APK
        run: |
          set -euo pipefail

          if [ ! -f "apk-distribution/app-debug.apk" ]; then
            echo "::error::apk-distribution/app-debug.apk not found"
            exit 1
          fi

          if [ ! -s "apk-distribution/app-debug.apk" ]; then
            echo "::error::apk-distribution/app-debug.apk is empty"
            exit 1
          fi

          if [ ! -f "apk-distribution/app-debug.apk.sha256" ]; then
            echo "::error::apk-distribution/app-debug.apk.sha256 not found"
            exit 1
          fi

          echo "Verifying SHA-256 checksum..."
          if (cd apk-distribution && sha256sum -c app-debug.apk.sha256); then
            echo "Checksum verified in apk-distribution"
          else
            sha256sum -c apk-distribution/app-debug.apk.sha256
          fi

          echo "Verifying APK ZIP structure..."
          unzip -tq apk-distribution/app-debug.apk
          echo "APK archive structure is valid."

      - name: Create GitHub Release and Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build ${{ github.run_number }} (Attempt ${{ github.run_attempt }})"

          APK_FILE="apk-distribution/app-debug.apk"
          APK_SIZE=$(ls -lh "$APK_FILE" | awk '{print $5}')
          SHA256_HASH=$(sha256sum "$APK_FILE" | awk '{print $1}')
          LATEST_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          RELEASE_NOTES=$(cat <<EOF
          ### Smart AI Digital Whiteboard - Debug APK

          - **Build:** Success
          - **Release Tag:** \`${TAG_NAME}\`
          - **File Name:** \`app-debug.apk\`
          - **File Size:** ${APK_SIZE}
          - **SHA-256 Checksum:** \`${SHA256_HASH}\`
          - **Direct Download URL:** [Download app-debug.apk](${LATEST_URL})
          EOF
          )

          echo "Creating release ${TAG_NAME}..."
          gh release create "$TAG_NAME" \
            "$APK_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)

          echo "### APK Release Published Successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag:** \`${TAG_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK Size:** ${APK_SIZE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA-256 Checksum:** \`${SHA256_HASH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Page:** [View Release](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Direct Download URL:** [Download app-debug.apk](${LATEST_URL})" >> "$GITHUB_STEP_SUMMARY"
